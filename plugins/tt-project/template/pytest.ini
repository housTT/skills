# tt-project: pytest in this harness (or a worktree of it) is isolated from any enclosing repository.
# This file makes the harness root pytest's rootdir, so a parent repository's pytest.ini,
# pyproject.toml, tox.ini, setup.cfg and conftest.py are never read, and puts the harness's own
# modules (runtime/ for `import ttp`, and the root) on the import path. Template upgrades merge
# into this file and keep this project's own edits; add local module paths to `pythonpath`.
[pytest]
pythonpath = runtime .
